<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahmad's Shelf</title>
<meta name="description" content="Ahmad Hassan's bookshelf in three.js. Hover a book to pull it out; click to open it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  :root { --bg: #ffffff; --ink: rgba(28, 26, 23, .85); --dim: rgba(28, 26, 23, .45); }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --ink: rgba(240, 246, 252, .85); --dim: rgba(240, 246, 252, .45); } }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  html.transparent, html.transparent body { background: transparent; }
  canvas { display: block; }
  .card { position: fixed; left: 0; top: 0; pointer-events: none; opacity: 0; transform: translate(-50%, -100%);
    background: rgba(255, 252, 246, .95); border-radius: 12px; padding: 10px 14px 11px;
    box-shadow: 0 12px 34px rgba(0, 0, 0, .35), 0 0 0 1px rgba(0, 0, 0, .05);
    font: 500 15px/1.35 Inter, system-ui, sans-serif; color: #1c1a17; white-space: nowrap; }
  .card small { display: block; font: 400 10.5px/1.6 "JetBrains Mono", ui-monospace, monospace; letter-spacing: .14em;
    color: #8a8378; text-transform: uppercase; }
  .card em { display: block; font: 400 11.5px/1.5 Inter, system-ui, sans-serif; color: #8a8378; font-style: normal; margin-top: 2px; }
  .title { position: fixed; left: 28px; top: 24px; pointer-events: none; color: var(--ink);
    font: 500 22px/1.2 "Cormorant Garamond", Georgia, serif; letter-spacing: .01em; }
  .title small { display: block; margin-top: 4px; font: 400 10.5px "JetBrains Mono", ui-monospace, monospace;
    letter-spacing: .14em; color: var(--dim); text-transform: uppercase; }
  .hint { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); pointer-events: none;
    font: 400 11px "JetBrains Mono", ui-monospace, monospace; letter-spacing: .1em; color: var(--dim); }
  .cursor { position: fixed; left: 0; top: 0; width: 20px; height: 26px; pointer-events: none; display: none;
    filter: drop-shadow(0 2px 3px rgba(0, 0, 0, .35)); }
  body.demo .cursor { display: block; }
  body.demo .hint, body.demo .title { display: none; }
  body.pointer { cursor: pointer; }
</style>
</head>
<body>
<div class="title">Ahmad's shelf<small>stories as reasoning</small></div>
<div class="card" id="card"><small id="card-author"></small><span id="card-note"></span><em id="card-hint"></em></div>
<div class="hint">hover a book · click to open it</div>
<svg class="cursor" id="cursor" viewBox="0 0 20 26"><path d="M1.5 1.5 L1.5 20 L6.4 15.6 L9.9 23.4 L13.2 21.9 L9.8 14.4 L16.2 14.4 Z" fill="#fff" stroke="#111" stroke-width="1.6" stroke-linejoin="round"/></svg>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const params = new URLSearchParams(location.search);
const DEMO = params.has('demo');
const CAPTURE = params.has('capture');
const ISSUE_URL = 'https://github.com/Ahmadhassan30/Ahmadhassan30/issues/new?title=Book%20recommendation%3A%20&body=Title%3A%0AAuthor%3A%0AWhy%20I%27d%20like%20it%3A%0A';
const TEX = 'https://cdn.jsdelivr.net/gh/mrdoob/three.js@r170/examples/textures/';
if (DEMO) document.body.classList.add('demo');
if (params.has('transparent')) document.documentElement.classList.add('transparent');

// ------------------------------------------------------------------ the books
const NAMED = {
  DOSTOEVSKY: { note: 'recursive psychology', cloth: '#5a1718', foil: '#d8b36a',
    quote: ['Pain and suffering are always', 'inevitable for a large intelligence', 'and a deep heart.'], from: 'Crime and Punishment' },
  KAFKA: { note: 'systems as absurdity', cloth: '#1f2c27', foil: '#d6cba6',
    quote: ['A book must be the axe', 'for the frozen sea within us.'], from: 'letter to Oskar Pollak, 1904' },
  TOLSTOY: { note: 'emergent complexity', cloth: '#2d412c', foil: '#d8b36a',
    quote: ['All happy families are alike;', 'each unhappy family is unhappy', 'in its own way.'], from: 'Anna Karenina' },
  NIETZSCHE: { note: 'epistemological provocation', cloth: '#141312', foil: '#c9a24e',
    quote: ['And if you gaze long into an abyss,', 'the abyss also gazes into you.'], from: 'Beyond Good and Evil' },
  PLATH: { note: 'precision under pressure', cloth: '#d9ccb2', foil: '#1a130e',
    quote: ['I took a deep breath and listened', 'to the old brag of my heart.', 'I am, I am, I am.'], from: 'The Bell Jar' },
};
const FILLER = ['#7a2e22', '#1d3554', '#4a5a3c', '#8c6d3f', '#2b2a29', '#6d5a72', '#a8987c', '#3b4f5c', '#933b2c', '#3f3229', '#56473a', '#24403f'];
// [author | null, thickness, height, depth]
const ROW = [
  [null, .034, .226, .160], [null, .026, .242, .166], ['DOSTOEVSKY', .058, .262, .172], [null, .024, .228, .158],
  [null, .036, .240, .166], [null, .030, .218, .156], ['KAFKA', .044, .236, .160], [null, .028, .214, .150],
  [null, .040, .250, .170], ['TOLSTOY', .072, .278, .180], [null, .026, .232, .156], [null, .034, .222, .164],
  [null, .029, .236, .160], ['NIETZSCHE', .048, .254, .168], [null, .030, .244, .162], [null, .024, .210, .150],
  [null, .037, .232, .164], ['PLATH', .042, .246, .160], [null, .032, .230, .158], [null, .038, .238, .164],
  [null, .027, .222, .156],
];
const ROMAN = ['I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII'];

// ------------------------------------------------------------------ renderer + scene
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setClearColor(0x000000, 0);
renderer.setPixelRatio(CAPTURE ? 1 : Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.35;

const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.01, 20);
const LOOK = new THREE.Vector3(0.02, 0.12, 0);

// a warm lamp from above-left throws a pool of light on the wall
const lamp = new THREE.SpotLight('#ffe2b8', 9, 6, 0.62, 0.75, 1.3);
lamp.position.set(-0.55, 1.35, 1.25);
lamp.target.position.set(0.05, 0.05, -0.05);
lamp.castShadow = true;
lamp.shadow.mapSize.set(2048, 2048);
lamp.shadow.bias = -0.0004;
lamp.shadow.camera.near = 0.5; lamp.shadow.camera.far = 4;
scene.add(lamp, lamp.target);
const fill = new THREE.DirectionalLight('#c9d6ff', 0.35);
fill.position.set(1.6, 0.6, 1.4);
scene.add(fill);
scene.add(new THREE.HemisphereLight('#fff1dc', '#3a2c20', 0.35));
// a small spot that finds whichever book you touch
const focus = new THREE.SpotLight('#fff3dc', 0, 2.5, 0.16, 0.9, 1.2);
focus.position.set(0.1, 0.75, 0.9);
scene.add(focus, focus.target);

// ------------------------------------------------------------------ textures
function canvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return [c, c.getContext('2d')]; }
function tex(c, srgb = true) { const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; }
let seed = 30;
function rand() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

// woven book cloth: colour plus a matching bump map
function weave(ctx, w, h, color) {
  ctx.fillStyle = color; ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) { ctx.fillStyle = `rgba(0,0,0,${.05 + rand() * .06})`; ctx.fillRect(0, y, w, 1); }
  for (let x = 0; x < w; x += 2) { ctx.fillStyle = `rgba(255,255,255,${.02 + rand() * .04})`; ctx.fillRect(x, 0, 1, h); }
  for (let i = 0; i < w * h / 40; i++) {
    ctx.fillStyle = rand() < .5 ? `rgba(0,0,0,${.12 * rand()})` : `rgba(255,255,255,${.08 * rand()})`;
    ctx.fillRect(rand() * w, rand() * h, 1 + rand() * 2, 1);
  }
}
function weaveBump(w, h) {
  const [c, ctx] = canvas(w, h);
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, w, h);
  for (let y = 0; y < h; y += 2) { ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(0, y, w, 1); }
  for (let x = 0; x < w; x += 2) { ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(x, 0, 1, h); }
  return tex(c, false);
}
const clothBump = weaveBump(256, 256);
clothBump.wrapS = clothBump.wrapT = THREE.RepeatWrapping;

function clothMaterial(color) {
  const [c, ctx] = canvas(256, 256); weave(ctx, 256, 256, color);
  return new THREE.MeshPhysicalMaterial({ map: tex(c), roughness: .82, sheen: .55, sheenRoughness: .6,
    sheenColor: new THREE.Color(color).lerp(new THREE.Color('#ffffff'), .35), bumpMap: clothBump, bumpScale: .6 });
}

// spine: cloth + foil. Foil is drawn twice: in colour, and into a roughness/metalness map so it really glints.
function spineMaterial(name, label, color, foil, th, h) {
  const H = 1024, W = Math.max(64, Math.round(th / h * H));
  const [c, ctx] = canvas(W, H);
  const [o, octx] = canvas(W, H);                   // G = roughness, B = metalness
  weave(ctx, W, H, color);
  const shade = ctx.createLinearGradient(0, 0, W, 0);
  shade.addColorStop(0, 'rgba(0,0,0,.3)'); shade.addColorStop(.2, 'rgba(255,255,255,.05)');
  shade.addColorStop(.6, 'rgba(255,255,255,0)'); shade.addColorStop(1, 'rgba(0,0,0,.35)');
  ctx.fillStyle = shade; ctx.fillRect(0, 0, W, H);
  octx.fillStyle = 'rgb(0,215,0)'; octx.fillRect(0, 0, W, H);
  const both = fn => { fn(ctx, foil); fn(octx, 'rgb(0,80,255)'); };
  both((g, col) => {
    g.fillStyle = col;
    for (const [y, t] of [[50, 7], [64, 2.5], [H - 66, 2.5], [H - 57, 7]]) g.fillRect(0, y, W, t);
  });
  if (name || label) {
    both((g, col) => {
      g.save(); g.translate(W / 2, H / 2); g.rotate(Math.PI / 2);
      g.fillStyle = col; g.textAlign = 'center'; g.textBaseline = 'middle';
      if (name) {
        const size = Math.min(W * .5, 74);
        g.font = `600 ${size}px "Cormorant Garamond", Georgia, serif`;
        g.letterSpacing = `${size * .14}px`;
        g.fillText(name, 0, size * .04);
      } else {
        g.font = `500 ${Math.min(W * .42, 40)}px "Cormorant Garamond", Georgia, serif`;
        g.letterSpacing = '4px';
        g.fillText(label, H * .28, 0);
      }
      g.restore();
    });
  }
  return new THREE.MeshPhysicalMaterial({ map: tex(c), roughnessMap: tex(o, false), metalnessMap: tex(o, false),
    roughness: 1, metalness: 1, sheen: .4, sheenRoughness: .6, sheenColor: new THREE.Color(color).lerp(new THREE.Color('#fff'), .3),
    bumpMap: clothBump, bumpScale: .5 });
}

function coverMaterial(name, info, d, h) {
  const H = 1024, W = Math.round(d / h * H);
  const [c, ctx] = canvas(W, H), [o, octx] = canvas(W, H);
  weave(ctx, W, H, info.cloth);
  octx.fillStyle = 'rgb(0,215,0)'; octx.fillRect(0, 0, W, H);
  for (const [g, col] of [[ctx, info.foil], [octx, 'rgb(0,80,255)']]) {
    g.strokeStyle = col; g.fillStyle = col; g.textAlign = 'center';
    g.lineWidth = 4; g.strokeRect(34, 34, W - 68, H - 68);
    g.lineWidth = 1.5; g.strokeRect(48, 48, W - 96, H - 96);
    let size = 78; g.font = `600 ${size}px "Cormorant Garamond", Georgia, serif`; g.letterSpacing = '10px';
    while (g.measureText(name).width > W - 150 && size > 30) { size -= 4; g.font = `600 ${size}px "Cormorant Garamond", Georgia, serif`; }
    g.fillText(name, W / 2, H * .42);
    g.letterSpacing = '0px'; g.font = 'italic 500 40px "Cormorant Garamond", Georgia, serif';
    g.fillText(info.note, W / 2, H * .42 + 72);
    g.beginPath(); g.arc(W / 2, H * .72, 7, 0, Math.PI * 2); g.fill();
  }
  return new THREE.MeshPhysicalMaterial({ map: tex(c), roughnessMap: tex(o, false), metalnessMap: tex(o, false),
    roughness: 1, metalness: 1, sheen: .4, sheenRoughness: .6, bumpMap: clothBump, bumpScale: .5 });
}
function endpaperMaterial(info, d, h) {   // the inside of the front cover
  const H = 512, W = Math.round(d / h * H);
  const [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#e9dfc9'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = info.cloth; ctx.globalAlpha = .16; ctx.lineWidth = 1;
  for (let i = -H; i < W + H; i += 10) { ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + H * .6, H); ctx.stroke(); }
  ctx.globalAlpha = 1;
  return new THREE.MeshStandardMaterial({ map: tex(c), roughness: .9 });
}
function pageMaterial(name, info, d, h) {   // the first page you see when the book opens
  const H = 1024, W = Math.round(d / h * H);
  const [c, ctx] = canvas(W, H);
  ctx.fillStyle = '#f3ead6'; ctx.fillRect(0, 0, W, H);
  const glow = ctx.createLinearGradient(0, 0, W, 0);
  glow.addColorStop(0, 'rgba(90,70,40,.18)'); glow.addColorStop(.12, 'rgba(90,70,40,0)');
  ctx.fillStyle = glow; ctx.fillRect(0, 0, W, H);
  const fit = (text, weight, size) => {   // largest size that fits the page width
    ctx.font = `${weight} ${size}px "Cormorant Garamond", Georgia, serif`;
    while (ctx.measureText(text).width > W * .84 && size > 18) { size -= 2; ctx.font = `${weight} ${size}px "Cormorant Garamond", Georgia, serif`; }
    return size;
  };
  ctx.fillStyle = '#1d1712'; ctx.textAlign = 'center'; ctx.letterSpacing = '8px';
  fit(name, 600, 60); ctx.fillText(name, W / 2, H * .22);
  ctx.letterSpacing = '0px'; ctx.fillStyle = '#6e5d48';
  fit(info.note, 'italic 500', 40); ctx.fillText(info.note, W / 2, H * .22 + 56);
  ctx.fillRect(W / 2 - 34, H * .35, 68, 2);
  ctx.fillStyle = '#1d1712';
  const qs = Math.min(...info.quote.map(l => fit(l, 'italic 500', 50)));
  ctx.font = `italic 500 ${qs}px "Cormorant Garamond", Georgia, serif`;
  info.quote.forEach((l, i) => ctx.fillText(l, W / 2, H * .47 + i * qs * 1.32));
  ctx.fillStyle = '#6e5d48'; ctx.letterSpacing = '3px'; fit(info.from.toUpperCase(), 500, 26);
  ctx.fillText(info.from.toUpperCase(), W / 2, H * .47 + info.quote.length * qs * 1.32 + 44);
  return new THREE.MeshStandardMaterial({ map: tex(c), color: '#ddd1ba', roughness: .95 });
}
function edgesMaterial() {   // page edges
  const [c, ctx] = canvas(512, 64);
  ctx.fillStyle = '#eee2c8'; ctx.fillRect(0, 0, 512, 64);
  for (let x = 0; x < 512; x += 2) { ctx.fillStyle = `rgba(110,90,60,${.06 + rand() * .14})`; ctx.fillRect(x, 0, 1, 64); }
  return new THREE.MeshStandardMaterial({ map: tex(c), roughness: .95 });
}
// ------------------------------------------------------------------ the room
await Promise.all(['600 64px "Cormorant Garamond"', '500 40px "Cormorant Garamond"', 'italic 500 40px "Cormorant Garamond"']
  .map(f => document.fonts.load(f)));
const loader = new THREE.TextureLoader();
const [woodMap, woodBump, woodRough] = await Promise.all(
  ['hardwood2_diffuse.jpg', 'hardwood2_bump.jpg', 'hardwood2_roughness.jpg'].map(f => loader.loadAsync(TEX + f)));
woodMap.colorSpace = THREE.SRGBColorSpace;
for (const t of [woodMap, woodBump, woodRough]) {   // crop one clean board out of the plank texture
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(.42, .11); t.offset.set(.3, .757); t.anisotropy = 8;
}

// invisible strip behind the books that only catches their shadows (none below the shelf)
const wall = new THREE.Mesh(new THREE.PlaneGeometry(1.5, .36), new THREE.ShadowMaterial({ opacity: .14 }));
wall.position.set(.02, .16, -.115); wall.receiveShadow = true; scene.add(wall);

const plank = new THREE.Mesh(new RoundedBoxGeometry(1.4, .04, .226, 3, .004),
  new THREE.MeshStandardMaterial({ map: woodMap, bumpMap: woodBump, bumpScale: 1.4, roughnessMap: woodRough,
    color: '#a88c72', roughness: 1 }));
plank.position.set(.02, -.02, 0); plank.castShadow = plank.receiveShadow = true; scene.add(plank);

// ------------------------------------------------------------------ build the books
const edges = edgesMaterial();
const books = [];          // everything you can hover
const FRONT = .104;
const COVER = .0028;

function makeBook(name, th, h, d, color, label) {
  const info = name ? NAMED[name] : null;
  const cloth = clothMaterial(info ? info.cloth : color);
  const outer = new THREE.Group();     // pivot at the bottom-centre, so books lean like books
  const body = new THREE.Group(); body.position.y = h / 2; outer.add(body);
  const add = (mesh, parent = body) => { mesh.castShadow = mesh.receiveShadow = true; parent.add(mesh); return mesh; };
  const rb = (w, hh, dd) => new RoundedBoxGeometry(w, hh, dd, 2, Math.min(.0012, w * .45));

  const back = add(new THREE.Mesh(rb(COVER, h, d), cloth));
  back.position.x = -th / 2 + COVER / 2;
  const spine = add(new THREE.Mesh(new RoundedBoxGeometry(th, h, COVER * 1.4, 2, .0012),
    [cloth, cloth, cloth, cloth, spineMaterial(name, label, info ? info.cloth : color, info ? info.foil : '#c9a65e', th, h), cloth]));
  spine.position.z = d / 2 - COVER * .7;
  const pagesGeo = new THREE.BoxGeometry(th - COVER * 2.2, h - .008, d - COVER * 2.2 - .003);
  const inner = info ? pageMaterial(name, info, d, h) : edges;
  const pages = add(new THREE.Mesh(pagesGeo, [inner, edges, edges, edges, edges, edges]));
  pages.position.z = -COVER * .6 - .0015;
  // the front cover hangs on a hinge at the spine so it can swing open
  const hinge = new THREE.Group(); hinge.position.set(th / 2 - COVER / 2, 0, d / 2 - COVER * .7); body.add(hinge);
  const front = add(new THREE.Mesh(rb(COVER, h, d),
    [info ? coverMaterial(name, info, d, h) : cloth, info ? endpaperMaterial(info, d, h) : cloth, cloth, cloth, cloth, cloth]), hinge);
  front.position.z = -d / 2 + COVER * .7;
  return { outer, body, hinge, parts: [back, spine, pages, front] };
}

let x = -.67;
ROW.forEach(([name, th, h, d], i) => {
  const color = FILLER[Math.floor(rand() * FILLER.length)];
  const label = !name && rand() < .55 ? ROMAN[Math.floor(rand() * ROMAN.length)] : null;
  const b = makeBook(name, th, h, d, color, label);
  const home = new THREE.Vector3(x + th / 2, 0, FRONT - d / 2);
  b.outer.position.copy(home);
  scene.add(b.outer);
  const book = { ...b, name, info: name ? NAMED[name] : null, th, h, d, home, index: i,
    yaw: (rand() - .5) * .016, pull: 0, open: 0, cover: 0 };
  b.parts.forEach(p => p.userData.book = book);
  books.push(book);
  x += th + .0016;
});
const rowCount = books.length;
{ // one book leaning on the last
  const b = makeBook(null, .034, .232, .16, '#8c6d3f', 'IX');
  b.outer.position.set(x + .046, 0, FRONT - .08);
  b.body.position.x = -.017;
  b.outer.rotation.z = .2;
  scene.add(b.outer);
  x += .1;
}
const slot = { name: 'YOUR PICK?', isSlot: true, h: .24, d: .16, th: .05, pull: 0, open: 0, cover: 0 };
{ // the empty slot, waiting for your recommendation
  const geo = new THREE.BoxGeometry(slot.th, slot.h, slot.d);
  const lines = new THREE.LineSegments(new THREE.EdgesGeometry(geo),
    new THREE.LineDashedMaterial({ color: '#6f6457', dashSize: .008, gapSize: .006, transparent: true, opacity: .8 }));
  lines.computeLineDistances();
  const ghost = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: '#fff4e0', transparent: true, opacity: .04, depthWrite: false }));
  ghost.add(lines); ghost.userData.book = slot;
  slot.outer = new THREE.Group(); slot.body = ghost; ghost.position.y = slot.h / 2; slot.outer.add(ghost);
  slot.home = new THREE.Vector3(x + slot.th / 2, 0, FRONT - slot.d / 2);
  slot.outer.position.copy(slot.home); slot.parts = [ghost]; slot.lines = lines;
  scene.add(slot.outer); books.push(slot);
  x += slot.th + .05;
}
{ // a pile lying flat
  let y = 0;
  for (const [w, t, d, c] of [[.21, .032, .17, '#1d3554'], [.195, .027, .165, '#933b2c'], [.2, .024, .16, '#a8987c']]) {
    const b = makeBook(null, t, w, d, c, null);
    b.outer.rotation.z = Math.PI / 2; b.outer.rotation.y = (rand() - .5) * .12;
    b.outer.position.set(x + w, y, FRONT - d / 2 - .004);
    scene.add(b.outer); y += t;
  }
}

// ------------------------------------------------------------------ dust in the lamp light
const DUST = 0, PUFF = 160, N = DUST + PUFF;
const dustPos = new Float32Array(N * 3), dustCol = new Float32Array(N * 4), dustVel = new Float32Array(N * 3), dustLife = new Float32Array(N);
for (let i = 0; i < DUST; i++) {
  dustPos.set([-.75 + rand() * 1.5, -.05 + rand() * .65, -.08 + rand() * .45], i * 3);
  dustVel.set([(rand() - .5) * .004, (rand() - .5) * .003, (rand() - .5) * .003], i * 3);
  dustCol.set([1, .93, .82, .18 + rand() * .3], i * 4);
}
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPos, 3));
for (let i = DUST; i < N; i++) dustCol.set([.74, .67, .56, 0], i * 4);
dustGeo.setAttribute('color', new THREE.BufferAttribute(dustCol, 4));
const [dc, dctx] = canvas(64, 64);
const rg = dctx.createRadialGradient(32, 32, 0, 32, 32, 32);
rg.addColorStop(0, 'rgba(255,255,255,1)'); rg.addColorStop(.4, 'rgba(255,255,255,.35)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
dctx.fillStyle = rg; dctx.fillRect(0, 0, 64, 64);
const dust = new THREE.Points(dustGeo, new THREE.PointsMaterial({ size: .0065, map: tex(dc), vertexColors: true,
  transparent: true, depthWrite: false }));
scene.add(dust);
let puffNext = 0;
function puff(b) {   // pulling a book off the shelf shakes a little dust loose
  const p = b.outer.position;
  for (let k = 0; k < 26; k++) {
    const i = DUST + (puffNext++ % PUFF);
    dustPos.set([p.x + (rand() - .5) * b.th * 1.6, b.h + .004 + rand() * .01, p.z + (rand() - .2) * b.d * .6], i * 3);
    dustVel.set([(rand() - .5) * .05, .025 + rand() * .05, (rand() - .2) * .04], i * 3);
    dustLife[i] = 1.2 + rand() * .9;
  }
}

// ------------------------------------------------------------------ interaction
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2(9, 9);
const pointerPx = { x: -100, y: -100 };
let hovered = null, shown = null, opened = null;
const parallax = new THREE.Vector2();
const card = document.getElementById('card');
const cursorEl = document.getElementById('cursor');
const hitTargets = books.flatMap(b => b.parts);

function setPointer(px, py) { pointerPx.x = px; pointerPx.y = py; pointer.set(px / innerWidth * 2 - 1, -(py / innerHeight) * 2 + 1); }
function pick() {
  raycaster.setFromCamera(pointer, camera);
  const hit = raycaster.intersectObjects(hitTargets, false)[0];
  return hit ? hit.object.userData.book : null;
}
function activate(b) {
  if (b && b.isSlot) { if (!DEMO) window.open(ISSUE_URL, '_blank'); return; }
  if (!b || !b.info || opened === b) { opened = null; return; }
  opened = b;
}
if (!DEMO) {
  addEventListener('pointermove', e => setPointer(e.clientX, e.clientY));
  addEventListener('pointerleave', () => setPointer(-100, -100));
  addEventListener('click', () => activate(pick()));
}

// ------------------------------------------------------------------ demo: a ghost hand browses
const STOPS = books.filter(b => b.info || b.isSlot);
const DWELL = 2.4, MOVE = .55, OPEN_AT = 'TOLSTOY', OPEN_DWELL = 5.2;
const dwellOf = b => b.name === OPEN_AT ? OPEN_DWELL : DWELL;
const CYCLE = STOPS.reduce((s, b) => s + dwellOf(b), 0);
let demoT = 0;
function screenOf(b, lift = .62) {
  const p = new THREE.Vector3(0, b.h * lift, b.d / 2);
  b.outer.localToWorld(p);
  p.project(camera);
  return { x: (p.x + 1) / 2 * innerWidth, y: (1 - p.y) / 2 * innerHeight };
}
function demo(dt) {
  demoT += dt;
  let t = demoT % CYCLE, i = 0;
  while (t > dwellOf(STOPS[i])) { t -= dwellOf(STOPS[i]); i++; }
  const from = STOPS[(i - 1 + STOPS.length) % STOPS.length], to = STOPS[i];
  const a = screenOf(from, .5), b = screenOf(to, .5);
  const k = Math.min(t / MOVE, 1), e = k < .5 ? 4 * k * k * k : 1 - Math.pow(-2 * k + 2, 3) / 2;
  const open = to.name === OPEN_AT && t > 1.2 && t < dwellOf(to) - .6;
  if (!opened) setPointer(a.x + (b.x - a.x) * e, a.y + (b.y - a.y) * e);
  opened = open ? to : null;
  cursorEl.style.transform = `translate(${pointerPx.x - 2}px, ${pointerPx.y - 2}px)`;
}

// ------------------------------------------------------------------ frame
function fit() {
  camera.aspect = innerWidth / innerHeight;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  camera.userData.dist = Math.max(.81 / (t * camera.aspect), .22 / t);
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}
addEventListener('resize', fit); fit();

const ease = (cur, target, rate, dt) => cur + (target - cur) * (1 - Math.exp(-rate * dt));
const openPose = new THREE.Vector3(), focusPos = new THREE.Vector3();
let clock = 0, lastHovered = null;
function step(dt) {
  clock += dt;
  if (DEMO) demo(dt);
  const dist = camera.userData.dist;
  parallax.x = ease(parallax.x, DEMO ? Math.sin(clock * .3) * .3 : pointer.x === 9 ? 0 : pointer.x, 2.5, dt);
  parallax.y = ease(parallax.y, DEMO ? 0 : pointer.y === 9 ? 0 : pointer.y, 2.5, dt);
  camera.position.set(LOOK.x + parallax.x * .08, LOOK.y + .05 + parallax.y * .035, dist);
  camera.lookAt(LOOK);

  hovered = opened || pick();
  if (hovered && hovered !== lastHovered && !hovered.isSlot && !opened) puff(hovered);
  lastHovered = hovered;
  document.body.classList.toggle('pointer', !!hovered && !!(hovered.info || hovered.isSlot) && !DEMO);

  const hi = hovered && hovered.index !== undefined ? hovered.index : -1;
  const hp = hi >= 0 ? books[hi].pull * (1 - books[hi].open) : 0;
  for (const b of books) {
    b.pull = ease(b.pull, b === hovered ? 1 : 0, 9, dt);
    b.open = ease(b.open, b === opened ? 1 : 0, 5, dt);
    b.cover = ease(b.cover, b === opened && b.open > .55 ? 1 : 0, 4.5, dt);
    const o = b.outer;
    o.position.copy(b.home);
    if (b.isSlot) {
      b.body.material.opacity = .04 + b.pull * (.1 + Math.sin(clock * 6) * .03);
      b.lines.material.opacity = .8 + b.pull * .2;
      continue;
    }
    // neighbours lean into the gap a pulled book leaves
    let lean = 0, spread = 0;
    if (hi >= 0 && b.index !== hi && b.index < rowCount) {
      const gap = Math.abs(b.index - hi), side = Math.sign(b.index - hi);
      const fall = Math.exp(-(gap - 1) / 1.3) * hp;
      lean = -side * .028 * fall; spread = side * .0035 * fall;
    }
    o.position.x += spread;
    o.position.z += b.pull * .072;
    o.position.y += b.pull * .006;
    let follow = 0;
    if (b === hovered && !opened) follow = THREE.MathUtils.clamp((pointer.x - (screenOf(b, .5).x / innerWidth * 2 - 1)) * 6, -1, 1);
    o.rotation.set(-.07 * b.pull, b.yaw + follow * .12 * b.pull, lean, 'YXZ');
    if (b.open > .001) {   // fly to the front, turn the cover toward you, then swing it open
      openPose.set(LOOK.x + b.d * .45 * b.cover, LOOK.y - b.h * .5 + .01, .23);
      o.position.lerp(openPose, b.open);
      o.rotation.y = THREE.MathUtils.lerp(o.rotation.y, -Math.PI / 2 + Math.sin(clock * 1.2) * .03, b.open);
      o.rotation.x = THREE.MathUtils.lerp(o.rotation.x, -.05, b.open);
      o.rotation.z = THREE.MathUtils.lerp(o.rotation.z, 0, b.open);
    }
    b.hinge.rotation.y = -Math.PI * .86 * b.cover;
  }
  // the focus light follows what you touch
  const lit = hovered && !hovered.isSlot ? hovered : null;
  if (lit) {
    focus.target.position.set(lit.outer.position.x, lit.outer.position.y + lit.h * .55, lit.outer.position.z);
    focusPos.set(lit.outer.position.x + .12, .78, .95);
    focus.position.lerp(focusPos, 1 - Math.exp(-8 * dt));
  }
  focus.intensity = ease(focus.intensity, lit && !opened ? 6 : 0, 6, dt);
  focus.target.updateMatrixWorld();

  // dust drifts; puffs rise and fade
  for (let i = 0; i < N; i++) {
    const j = i * 3;
    if (i < DUST) {
      dustPos[j] += dustVel[j] * dt + Math.sin(clock * .5 + i) * .0006 * dt;
      dustPos[j + 1] += dustVel[j + 1] * dt + Math.cos(clock * .4 + i * 1.7) * .0005 * dt;
      dustPos[j + 2] += dustVel[j + 2] * dt;
      if (dustPos[j + 1] > .62) dustPos[j + 1] = -.04;
      if (dustPos[j + 1] < -.05) dustPos[j + 1] = .6;
      if (Math.abs(dustPos[j]) > .78) dustVel[j] *= -1;
    } else if (dustLife[i] > 0) {
      dustLife[i] -= dt;
      dustVel[j + 1] -= .012 * dt; dustVel[j] *= .985; dustVel[j + 2] *= .985;
      dustPos[j] += dustVel[j] * dt; dustPos[j + 1] += dustVel[j + 1] * dt; dustPos[j + 2] += dustVel[j + 2] * dt;
      dustCol[i * 4 + 3] = Math.max(0, Math.min(1, dustLife[i])) * .75;
    } else {
      dustCol[i * 4 + 3] = 0;
    }
  }
  dustGeo.attributes.position.needsUpdate = true; dustGeo.attributes.color.needsUpdate = true;

  // the label card
  const cardBook = hovered && (hovered.info || hovered.isSlot) ? hovered : null;
  if (cardBook) shown = cardBook;
  if (shown) {
    const vis = Math.min(1, shown.pull * 1.3) * Math.max(0, 1 - shown.open * 2.5);
    const s = screenOf(shown, 1.08);
    const cw = card.offsetWidth, ch = card.offsetHeight;
    card.style.left = `${Math.min(Math.max(s.x, cw / 2 + 12), innerWidth - cw / 2 - 12)}px`;
    card.style.top = `${Math.max(s.y - 6, ch + (DEMO ? 12 : 84))}px`;
    card.style.opacity = vis;
    card.style.transform = `translate(-50%, -100%) translateY(${(1 - vis) * 8 - 4}px)`;
    document.getElementById('card-author').textContent = shown.name;
    document.getElementById('card-note').textContent = shown.isSlot ? 'recommend me a book' : shown.info.note;
    document.getElementById('card-hint').textContent = shown.isSlot ? 'click to open a GitHub issue' : 'click to open';
  }
  renderer.render(scene, camera);
}

if (CAPTURE) {
  window.__advance = dt => step(dt);
  step(0); window.__ready = true;
} else {
  let last = performance.now();
  renderer.setAnimationLoop(now => { step(Math.min((now - last) / 1000, .05)); last = now; });
}
</script>
</body>
</html>
