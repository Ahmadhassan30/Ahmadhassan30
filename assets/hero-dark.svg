<svg xmlns="http://www.w3.org/2000/svg" width="1016" height="530" viewBox="0 0 1016 530" xml:space="preserve" role="img" aria-label="Ahmad Hassan: ASCII portrait and profile card">
<style>
@font-face{font-family:JBM;src:url(data:font/woff;base64,) format('woff');}
text{font-family:JBM,ui-monospace,SFMono-Regular,Consolas,'Liberation Mono',Menlo,monospace;font-size:13px;white-space:pre;}
.art{fill:#58a6ff;} .k{fill:#ffa657;} .v{fill:#a5d6ff;} .m{fill:#8b949e;} .t{fill:#79c0ff;font-weight:bold;}
.r{opacity:0;animation:rain .5s cubic-bezier(.2,.7,.3,1) forwards;}
@keyframes rain{0%{opacity:0;transform:translateY(-10px);}60%{opacity:1;}100%{opacity:1;transform:none;}}
.i{opacity:0;animation:slide .45s ease-out forwards;}
@keyframes slide{from{opacity:0;transform:translateX(-12px);}to{opacity:1;transform:none;}}
.scan{animation:scan 6s linear infinite;animation-delay:2.4s;opacity:0;}
@keyframes scan{0%{opacity:0;transform:translateY(0);}4%{opacity:.55;}70%{opacity:.55;}80%{opacity:0;transform:translateY(437px);}100%{opacity:0;transform:translateY(437px);}}
.cur{animation:blink 1.05s steps(1) infinite;}
@keyframes blink{50%{opacity:0;}}
@media (prefers-reduced-motion:reduce){.r,.i{animation:none;opacity:1;}.scan{display:none;}.cur{animation:none;}}
</style>
