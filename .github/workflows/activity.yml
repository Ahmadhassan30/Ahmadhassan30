name: Refresh activity chart

on:
  schedule:
    - cron: "17 */6 * * *"  # every 6 hours
  workflow_dispatch:
  push:
    branches: [master]
    paths: [assets/activity.mjs]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-save --no-package-lock echarts@6.1.0
      - run: node assets/activity.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity-light.svg assets/activity-dark.svg
          git diff --cached --quiet || { git commit -m "refresh activity chart"; git push; }
